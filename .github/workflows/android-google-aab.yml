name: Build google signed AAB
run-name: Google AAB ${{ inputs.build_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: CLI request ID for locating the exact run
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - app/src/google/google-release.keystore

permissions:
  contents: write
  packages: read

concurrency:
  group: google-aab-signing
  cancel-in-progress: false

jobs:
  build-google-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      GH_PACKAGES_USER: ${{ secrets.GH_PACKAGES_USER || github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      GRADLE_JVM_ARGS: -Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVM_ARGS: -Xmx1024m

    steps:
      # 使用实际触发 ref；不能沿用来源项目硬编码 checkout main，否则 CLI 指定分支无效。
      - name: Checkout requested revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes 在消费者结束后收到 SIGPIPE，不应被当作许可证接受失败。
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;36.1.0"

      - name: Validate channel, dependencies and generate signing on main
        run: python3 scripts/google_aab_ci.py prepare

      - name: Print runner diagnostics
        run: |
          java -version
          nproc
          free -h
          df -h

      - name: Build signed googleRelease AAB
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          COMMON_ARGS=(
            "-Dorg.gradle.jvmargs=${GRADLE_JVM_ARGS}"
            "-Dkotlin.daemon.jvmargs=${KOTLIN_DAEMON_JVM_ARGS}"
            --max-workers=1 --no-parallel --no-daemon --no-configuration-cache --console=plain
          )
          AAB_NAME="$(./gradlew -q :app:printGoogleReleaseAabName "${COMMON_ARGS[@]}")"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          # 保留当前 AGP 9.3 的优化和已审计 consumer rules，不照搬来源的关闭优化/R8 full mode 参数。
          ./gradlew :app:bundleGoogleRelease :app:testGoogleReleaseUnitTest :app:lintGoogleRelease \
            "${COMMON_ARGS[@]}" --stacktrace

      - name: Verify signature and collect release files
        env:
          AAB_NAME: ${{ steps.build.outputs.aab_name }}
        run: python3 scripts/google_aab_ci.py collect --aab-name "$AAB_NAME"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-release-${{ github.run_number }}
          path: build/google-aab/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: google-build-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove runner signing file
        if: always()
        run: rm -f -- app/src/google/google-release.keystore
