# 当前既有测试配置。后端路由参数完整保留来源 dev 配置。
applicationId=com.leafmotivation.quizguessoncolor
versionCode=4
versionName=1.0.4
fcmUrl=https://aavd.gamespearl.com
fcmPkg=com.leafmotivation.quizguessoncolor
remotePushEnabled=true
userChannel=natural

# Token 上报协议：按渠道配置，参数名同时用于 URL 与签名排序；值不加引号。
# 上传路径与 fcmUrl 拼接，首尾斜杠会统一处理。
fcmPath=/browser/wnfree
fcmSecretKey=kA4deAzg7YpWTSZPYYa7wWb7WQk8Z7V5
fcmParamToken=wndk
fcmParamUid=weid
fcmParamPack=dfk
fcmHeaderSig=seg

# 设置页：以下保留原示例值，请按渠道替换为正式隐私协议链接和反馈邮箱。
privacyUrl=https://example.com/privacy
feedbackEmail=feedback@example.com

# Trustlook 许可证与当前渠道包名绑定；未配置时扫描显示不可用，不跨渠道回退。
trustlookApiKey=b9f8b4700d6059b3b15f319ee701ea2a8cdea94bf5d7e47c91535ee1

# XM/Collect 使用 local 自身包名和服务地址；开关同时控制 SDK 合入与运行时检测。
xmRiskEnabled=true
# HTTP 会被服务重定向且真机上传返回 401；直连 HTTPS 才能取得有效风控回包。
xmRiskBaseUrl=https://aimouse.xoxneaxrch.com/
